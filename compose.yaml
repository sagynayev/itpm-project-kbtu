services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pdd_chatbot
      POSTGRES_USER: pdd_chatbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pdd_chatbot_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pdd_chatbot"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-only-change-me}
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      POSTGRES_DB: pdd_chatbot
      POSTGRES_USER: pdd_chatbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pdd_chatbot_dev}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    volumes:
      - ./data:/data:ro
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py import_pdd /data/pdd_official_ru.jsonl &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60"

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
